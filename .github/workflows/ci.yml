name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: CI only needs to check out code
permissions:
  contents: read

jobs:
  api:
    name: API (typecheck, lint, test)
    runs-on: ubuntu-latest
    env:
      # Keep the test MongoDB binary outside node_modules (which npm ci wipes) so it can be cached
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Cache MongoDB binary (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('api/package-lock.json') }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  web:
    name: Web app (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Legacy pages still have type errors; they are replaced in the UI rebuild (Phase 2),
      # which also removes ignoreBuildErrors. Make this step blocking then.
      - name: Typecheck (non-blocking until UI rebuild)
        run: npm run typecheck
        continue-on-error: true
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
